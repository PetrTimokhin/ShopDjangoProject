{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Авторизация</title>
    <link rel="stylesheet"
          type="text/css"
          href="{% static 'users/css/login_css.css' %}"
    />
</head>
  <body>
      <div class="login">
        <form method="POST">
            {% csrf_token %}
            <div class="login-screen">

              <div class="app-title">
                <h1>Авторизация</h1>
              </div>

              <div class="login-form">

                <div class="control-group">
                    <input type="text" class="login-field" value="" name='email' placeholder="Почта" id="email">
                    <label class="login-field-icon fui-user" for="email"></label>
                </div>

                <div class="control-group">
                    <input type="password" class="login-field" value="" name='password' placeholder="Пароль" id="login-pass">
                    <label class="login-field-icon fui-lock" for="login-pass"></label>
                </div>
                <div class="control-group">
                    <input type="submit" class="btn btn-primary btn-large btn-block" value="Вход в аккаунт">
                </div>
<!--                <a class="btn btn-primary btn-large btn-block" href="../../index/">Вход в аккаунт</a>-->

                <div class="login-link-2">
                    <a class="login-link" href="../register/">Еще нет аккаунта?</a>
                </div>

              </div>

            </div>
        </form>
      </div>
  </body>
</html>
